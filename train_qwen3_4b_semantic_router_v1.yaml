### model
model_name_or_path: /root/autodl-tmp/trippilot-finetune/models/Qwen3-4B-Instruct-2507
quantization_bit: 4
quantization_method: bnb
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset_dir: /root/autodl-tmp/trippilot-finetune/data
dataset: trippilot_semantic_router_v1_train
eval_dataset: trippilot_semantic_router_v1_dev
template: qwen3_nothink
cutoff_len: 1024
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
output_dir: /root/autodl-tmp/trippilot-finetune/outputs/qwen3-4b-semantic-router-v1
logging_steps: 5
save_strategy: steps
save_steps: 30
save_total_limit: 2
