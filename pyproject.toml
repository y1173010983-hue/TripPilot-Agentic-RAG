[project]
name = "trippilot"
version = "0.1.0"
description = "旅游智能助手：文档存库与 Agentic 检索"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "psycopg[binary,pool]>=3.2,<4", "python-multipart>=0.0.20",
  "httpx>=0.28,<1", "pyjwt>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "langgraph-checkpoint-postgres>=3,<4", "celery[redis]>=5.5,<6",
  "pymupdf>=1.25,<2", "python-docx>=1.1,<2", "jieba>=0.42,<1",
  "rank-bm25>=0.2,<1", "pymilvus>=3.0.1,<4", "minio>=7.2,<8",
]

[project.optional-dependencies]
local-models = ["sentence-transformers>=5,<7"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
trippilot = "trippilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/trippilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
