name: trippilot

services:
  postgres:
    image: registry-1.docker.io/library/postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TRIP_POSTGRES_USER:?missing}
      POSTGRES_PASSWORD: ${TRIP_POSTGRES_PASSWORD:?missing}
      POSTGRES_DB: ${TRIP_POSTGRES_DB:-trippilot}
    ports:
      - "127.0.0.1:${TRIP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${TRIP_REDIS_PASSWORD:?missing}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${TRIP_REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - ./volumes/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${TRIP_MINIO_ROOT_USER:?missing}
      MINIO_ROOT_PASSWORD: ${TRIP_MINIO_ROOT_PASSWORD:?missing}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "127.0.0.1:${TRIP_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${TRIP_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./volumes/minio:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: registry-1.docker.io/milvusdb/milvus:v3.0.1
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
      COMMON_SECURITY_DEFAULTROOTPASSWORD: ${TRIP_MILVUS_ROOT_PASSWORD:?missing}
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: ${TRIP_MINIO_ROOT_USER:?missing}
      MINIO_SECRET_ACCESS_KEY: ${TRIP_MINIO_ROOT_PASSWORD:?missing}
    ports:
      - "127.0.0.1:${TRIP_MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${TRIP_MILVUS_WEBUI_PORT:-9091}:9091"
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
